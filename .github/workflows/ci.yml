name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Required verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Verify v1.2.0 precision-intelligence safety contract
        run: npm run verify:safety

      - name: Unit and integration tests
        run: npm test

      - name: Precision classification evaluation
        run: npm run evaluate:precision

      - name: ESLint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Validate CSS
        run: npm run validate:css

      - name: Real local startup and health probe
        run: npm run verify:health:full

      - name: Dependency audit
        run: npm audit --audit-level=high

  config-contract:
    name: Configuration contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON templates
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('.outlook-config.json.example', 'utf8'))"

      - name: Verify secret and runtime files are ignored
        run: |
          for pattern in node_modules .mail-cache.json .outlook-config.json mail-intelligence.sqlite '*.sqlite-wal' '*.sqlite-shm' /data/ /backups/ '*.log' runtime-config.json accounts.json; do
            grep -Fq "$pattern" .gitignore || { echo "Missing .gitignore rule: $pattern"; exit 1; }
          done

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
