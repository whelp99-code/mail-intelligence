name: Manual Release Package - No Deployment

on:
  workflow_dispatch:
    inputs:
      release_note:
        description: 'Reason for creating a verified release artifact'
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: mail-intelligence
  NODE_VERSION: '22'

jobs:
  verify-and-package:
    name: Verify and package only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run release gates
        run: |
          npm run verify:v1.2.2

      - name: Create verified artifact
        run: |
          set -euo pipefail
          COMMIT_SHA="${{ github.sha }}"
          ARTIFACT_NAME="${APP_NAME}-${COMMIT_SHA:0:7}"
          mkdir -p dist
          cp -r server.mjs src scripts schemas test docs migrations deploy .github AGENTS.md README.md package.json package-lock.json dist/
          cp .gitignore .eslintrc.json .stylelintrc.json .htmlhintrc dist/
          cp .outlook-config.json.example dist/
          cat > dist/VERSION.json <<JSON
          {
            "name": "${APP_NAME}",
            "version": "1.2.2",
            "commit": "${COMMIT_SHA}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "releaseNote": ${{ toJSON(inputs.release_note) }},
            "deployment": "disabled"
          }
          JSON
          tar -czf "${ARTIFACT_NAME}.tar.gz" -C dist .
          sha256sum "${ARTIFACT_NAME}.tar.gz" > "${ARTIFACT_NAME}.tar.gz.sha256"

          # Prove that the uploaded bytes are independently installable and
          # satisfy the same release gates after extraction.
          VERIFY_DIR="$(mktemp -d)"
          tar -xzf "${ARTIFACT_NAME}.tar.gz" -C "$VERIFY_DIR"
          (
            cd "$VERIFY_DIR"
            npm ci
            npm run verify:v1.2.2
          )
          rm -rf "$VERIFY_DIR"

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: mail-intelligence-${{ github.sha }}
          path: |
            mail-intelligence-*.tar.gz
            mail-intelligence-*.tar.gz.sha256
          retention-days: 30

      - name: Confirm no deployment occurred
        run: |
          echo 'Artifact created. Production and staging deployment remain disabled by design.'
          echo 'No SSH, server restart, deployment, mail mutation, or external publication was performed.'

concurrency:
  group: manual-release-${{ github.ref }}
  cancel-in-progress: false
